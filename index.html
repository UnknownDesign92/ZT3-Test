<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZT3 Safe Diagnostic</title><style>body{font:16px system-ui;background:#101827;color:#f5f7fb;margin:0;padding:22px}main{max-width:700px;margin:auto}button{padding:13px;margin:6px 4px 6px 0;border:0;border-radius:10px;background:#3b82f6;color:white;font-weight:700}button:disabled{opacity:.45}section{background:#1e293b;padding:15px;border-radius:12px;margin:12px 0}pre{white-space:pre-wrap;word-break:break-word;font-size:12px}small{color:#cbd5e1}</style></head><body><main><h1>ZT3 · sichere Diagnose</h1><p>Nur Bluetooth-Erkennung und Empfang. Keine Authentifizierungs-, Konfigurations- oder Firmware-Schreibbefehle.</p><section><strong id="status">Nicht verbunden</strong><p><button id="connect">ZT3 verbinden</button><button id="disconnect" disabled>Trennen</button></p><small>Bluefy auf dem iPhone verwenden. Segway-App vorher schließen.</small></section><section><h2>Diagnose</h2><button id="copy">JSON kopieren</button><button id="save">JSON speichern</button><pre id="log"></pre></section></main><script>
'use strict';
const N='6e400001-0000-0000-006e-696e65626f74',U='6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const state={schema:'zt3-safe-diagnostic-v6',createdAt:new Date().toISOString(),device:null,services:[],notifications:[],events:[],writesSent:0,pairingAuthenticated:false,firmwareRead:false};
let device=null;const $=id=>document.getElementById(id);
function event(message){state.events.push({at:new Date().toISOString(),message});$('log').textContent=state.events.slice(-14).map(e=>e.at.slice(11,19)+' '+e.message).join('\n')}
function status(s){$('status').textContent=s}
function error(e){event('Fehler: '+(e&&e.message||String(e)));status('Fehler – siehe Protokoll')}
async function connect(){try{if(!navigator.bluetooth)throw Error('Web Bluetooth nicht verfügbar. Bitte Bluefy nutzen.');event('Geräteauswahl geöffnet');device=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[N,U]});state.device={name:device.name,id:device.id};event('Gewählt: '+(device.name||'ohne Namen'));device.addEventListener('gattserverdisconnected',()=>{status('Getrennt');$('disconnect').disabled=true;event('Bluetooth getrennt')});status('Verbinde …');const server=await device.gatt.connect();state.services=[];for(const [name,uuid] of [['Ninebot',N],['Nordic UART',U]]){try{const svc=await server.getPrimaryService(uuid),entry={name,uuid,characteristics:[],notificationStarted:[]};for(const ch of await svc.getCharacteristics()){const props=['read','write','writeWithoutResponse','notify','indicate'].filter(k=>ch.properties[k]);entry.characteristics.push({uuid:ch.uuid,properties:props});if(ch.properties.notify){try{await ch.startNotifications();ch.addEventListener('characteristicvaluechanged',e=>{const bytes=new Uint8Array(e.target.value.buffer,e.target.value.byteOffset,e.target.value.byteLength);const hex=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join(' ');state.notifications.push({at:new Date().toISOString(),uuid:ch.uuid,hex});event('Empfangen: '+ch.uuid.slice(0,8)+' '+hex)});entry.notificationStarted.push(ch.uuid)}catch(ex){event('Notify-Fehler: '+ex.message)}}}state.services.push(entry);event(name+': '+entry.characteristics.length+' Kanäle gefunden')}catch(ex){event(name+': nicht verfügbar ('+ex.message+')')}}status('Verbunden · Nur-Lese-Diagnose');$('disconnect').disabled=false;event('Bereit. Keine Fahrzeugbefehle gesendet.')}catch(e){error(e)}}
$('connect').addEventListener('click',connect);$('disconnect').addEventListener('click',()=>{if(device&&device.gatt.connected)device.gatt.disconnect()});$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2));event('JSON kopiert')}catch(e){error(e)}});$('save').addEventListener('click',()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}));a.download='zt3-diagnose.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);event('JSON-Download gestartet')});event('Seite geladen. Web Bluetooth: '+Boolean(navigator.bluetooth));
</script></body></html>
